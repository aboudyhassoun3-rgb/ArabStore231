<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 36" role="img" aria-label="Gmail">
  <title>Gmail</title>
  <!-- Gmail official colors (2020): blue #4285F4, red #EA4335, yellow #FBBC04, green #34A853 -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- bottom V (yellow) -->
    <path d="M9 26.5 24 16.5 39 26.5" stroke="#FBBC04" stroke-width="5.5"/>
    <!-- left leg (blue) -->
    <path d="M9 9.5v17" stroke="#4285F4" stroke-width="5.5"/>
    <!-- right leg (green) -->
    <path d="M39 9.5v17" stroke="#34A853" stroke-width="5.5"/>
    <!-- top M (red) -->
    <path d="M9 9.5 24 19.5 39 9.5" stroke="#EA4335" stroke-width="5.5"/>
  </g>
</svg>
